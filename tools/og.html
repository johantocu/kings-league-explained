<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image source</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;700&family=Inter+Tight:wght@700;900&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #050c18; background-image: linear-gradient(170deg, #050c18 0%, #091726 25%, #0c1e3e 50%, #091630 75%, #060f20 100%); color: #fff; font-family: 'Inter Tight', system-ui, sans-serif; position: relative; }
  .glow { position: absolute; inset: -200px 0 auto; height: 620px; background: radial-gradient(50% 55% at 30% 20%, rgba(57,255,20,.20), transparent 70%); }
  .wrap { position: absolute; inset: 0; padding: 70px 76px; display: grid; grid-template-columns: 1.35fr 1fr; gap: 50px; align-items: center; }
  .kicker { display: inline-block; font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #39FF14; border: 1.5px solid rgba(57,255,20,.3); border-radius: 999px; padding: 9px 18px; background: rgba(57,255,20,.06); }
  h1 { font-size: 78px; line-height: 1.0; letter-spacing: -0.04em; font-weight: 900; margin: 26px 0 22px; }
  h1 span { color: #39FF14; }
  p { font-size: 26px; color: rgba(255,255,255,.78); margin: 0; line-height: 1.35; }
  .meta { margin-top: 30px; font-family: 'Geist Mono', monospace; font-size: 18px; color: rgba(255,255,255,.62); letter-spacing: .04em; }
  .art { display: grid; gap: 18px; }
  .chips { display: flex; gap: 12px; flex-wrap: wrap; }
  .chip { font-family: 'Geist Mono', monospace; font-size: 20px; font-weight: 700; padding: 10px 16px; border-radius: 14px; background: #0B1A2A; border: 1.5px solid rgba(57,255,20,.3); color: #39FF14; }
  svg { width: 100%; border-radius: 20px; border: 1.5px solid rgba(57,255,20,.3); box-shadow: 0 30px 80px -30px rgba(57,255,20,.35); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div>
      <span class="kicker">Interactive explainer</span>
      <h1>Kings League, <span>Explained</span></h1>
      <p>The football league built like a video game: secret cards, a giant dice and streamer presidents.</p>
      <div class="meta">By Johan Torres · EN · IT · ES</div>
    </div>
    <div class="art">
      <svg viewBox="0 0 320 200" aria-hidden="true">
        <rect width="320" height="200" rx="14" fill="#081521"/>
        <g fill="none" stroke="rgba(255,255,255,.22)" stroke-width="2"><rect x="4" y="4" width="312" height="192" rx="6"/><line x1="160" y1="4" x2="160" y2="196"/><circle cx="160" cy="100" r="32"/><rect x="4" y="60" width="32" height="80"/><rect x="284" y="60" width="32" height="80"/></g>
        <rect x="14" y="94" width="12" height="12" rx="3" fill="#39FF14"/>
        <rect x="294" y="94" width="12" height="12" rx="3" fill="#081521" stroke="#fff" stroke-width="2.5"/>
        <g fill="#39FF14"><circle cx="60" cy="45" r="7"/><circle cx="60" cy="100" r="7"/><circle cx="60" cy="155" r="7"/><circle cx="110" cy="70" r="7"/><circle cx="110" cy="130" r="7"/><circle cx="140" cy="100" r="7"/></g>
        <g fill="#081521" stroke="#fff" stroke-width="2.5"><circle cx="260" cy="45" r="6"/><circle cx="260" cy="100" r="6"/><circle cx="260" cy="155" r="6"/><circle cx="210" cy="70" r="6"/><circle cx="210" cy="130" r="6"/><circle cx="180" cy="100" r="6"/></g>
      </svg>
      <div class="chips"><span class="chip">7v7</span><span class="chip">36'</span><span class="chip">x2</span><span class="chip">1v1 · 2v2 · 3v3</span></div>
    </div>
  </div>
</body>
</html>
