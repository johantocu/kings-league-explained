<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image source</title>
<link rel="stylesheet" href="../design/tokens.css">
<link rel="stylesheet" href="../design/components.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: var(--ground); }
  .halo { position: absolute; top: -300px; left: 50%; transform: translateX(-50%); width: 1200px; height: 760px; background: radial-gradient(closest-side, rgba(51,70,255,0.42), rgba(42,27,110,0.28) 55%, transparent 75%); }
  .wrap { position: absolute; inset: 0 0 58px; padding: 0 72px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 48px; align-items: center; }
  .pills { display: flex; gap: 10px; margin-bottom: 20px; }
  .kx-pill { font-size: 14px; min-height: 36px; padding: 8px 16px; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: 100px; line-height: .9; text-transform: uppercase; margin: 0 0 22px; color: var(--ink); }
  h1 em { font-style: normal; color: var(--gold); }
  p { margin: 0; font-size: 23px; line-height: 1.35; color: var(--ink-soft); }
  .by { margin-top: 16px; font-family: var(--font-wide); font-stretch: 125%; font-weight: 800; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  svg { width: 100%; border-radius: 20px; border: 2px solid var(--led-blue); box-shadow: var(--glow-led); }
  .ticker { position: absolute; left: 0; right: 0; bottom: 0; background: var(--gold); color: var(--on-gold); padding: 12px 0 12px 28px; white-space: nowrap; font-family: var(--font-wide); font-stretch: 125%; font-weight: 900; font-size: 22px; text-transform: uppercase; }
  .ticker span { margin-right: 26px; }
</style>
</head>
<body>
  <div class="halo"></div>
  <div class="wrap">
    <div>
      <div class="pills"><span class="kx-pill kx-pill--gold">Interactive explainer</span><span class="kx-pill">EN · IT · ES</span></div>
      <h1>Kings League, <em>Explained</em></h1>
      <p>The football league built like a video game: secret cards, a giant dice and streamer presidents.</p>
      <div class="by">By Johan Torres</div>
    </div>
    <svg viewBox="0 0 320 200" aria-hidden="true">
      <defs><radialGradient id="g" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#1A1550"/><stop offset="1" stop-color="#000"/></radialGradient></defs>
      <rect width="320" height="200" rx="14" fill="url(#g)"/>
      <g fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.5"><rect x="6" y="6" width="308" height="188" rx="8"/><line x1="160" y1="6" x2="160" y2="194"/><circle cx="160" cy="100" r="30"/></g>
      <g fill="rgba(244,175,35,.10)" stroke="#F4AF23" stroke-width="2"><rect x="6" y="56" width="38.4" height="88"/><rect x="275.6" y="56" width="38.4" height="88"/></g>
      <rect x="14" y="93" width="14" height="14" rx="3" fill="#F4AF23"/>
      <rect x="292" y="93" width="14" height="14" rx="3" fill="#000" stroke="#fff" stroke-width="2.5"/>
      <g fill="#F4AF23"><circle cx="62" cy="46" r="7.5"/><circle cx="62" cy="100" r="7.5"/><circle cx="62" cy="154" r="7.5"/><circle cx="110" cy="72" r="7.5"/><circle cx="110" cy="128" r="7.5"/><circle cx="142" cy="100" r="7.5"/></g>
      <g fill="#000" stroke="#fff" stroke-width="2.5"><circle cx="258" cy="46" r="6.5"/><circle cx="258" cy="100" r="6.5"/><circle cx="258" cy="154" r="6.5"/><circle cx="210" cy="72" r="6.5"/><circle cx="210" cy="128" r="6.5"/><circle cx="178" cy="100" r="6.5"/></g>
    </svg>
  </div>
  <div class="ticker"><span>Secret cards</span><span>·</span><span>Scale-Up</span><span>·</span><span>Double goals</span><span>·</span><span>The dice</span><span>·</span><span>Matchball</span><span>·</span><span>Streamer presidents</span></div>
</body>
</html>
